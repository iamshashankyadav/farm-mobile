name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Release APKs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode counts commits

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing keystore
        env:
          FARM_KEYSTORE_BASE64: ${{ secrets.FARM_KEYSTORE_BASE64 }}
        if: env.FARM_KEYSTORE_BASE64 != ''
        run: |
          echo "$FARM_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/farm-release.jks"
          echo "FARM_KEYSTORE_PATH=$RUNNER_TEMP/farm-release.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          FARM_KEYSTORE_PASSWORD: ${{ secrets.FARM_KEYSTORE_PASSWORD }}
          FARM_KEY_ALIAS: ${{ secrets.FARM_KEY_ALIAS }}
          FARM_KEY_PASSWORD: ${{ secrets.FARM_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: farm-apks
          path: |
            android/customer/build/outputs/apk/release/*.apk
            android/delivery/build/outputs/apk/release/*.apk
